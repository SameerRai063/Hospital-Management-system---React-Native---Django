<!doctype html>
<html>
  <head>
    <title>eSewa Sandbox Test</title>
  </head>

  <body>
    <h2>eSewa Sandbox Payment</h2>

    <form
      action="https://rc-epay.esewa.com.np/api/epay/main/v2/form"
      method="POST"
    >
      <input type="hidden" name="amount" value="500" />
      <input type="hidden" name="tax_amount" value="0" />
      <input type="hidden" name="total_amount" value="500" />

      <!-- Replace with YOUR transaction_uuid -->
      <input
        type="hidden"
        name="transaction_uuid"
        value="58c773cd-ed0d-4605-8fa6-1be69777e422"
      />

      <input type="hidden" name="product_code" value="EPAYTEST" />

      <input type="hidden" name="product_service_charge" value="0" />

      <input type="hidden" name="product_delivery_charge" value="0" />

      <input
        type="hidden"
        name="success_url"
        value="http://localhost:8000/api/payments/success/"
      />

      <input
        type="hidden"
        name="failure_url"
        value="http://localhost:8000/api/payments/failure/"
      />

      <input
        type="hidden"
        name="signed_field_names"
        value="total_amount,transaction_uuid,product_code"
      />

      <!-- Replace with YOUR signature -->
      <input
        type="hidden"
        name="signature"
        value="Ul3rZG6uD5YB6MW0NYKfQ3jd9vCTMviIGHDpL1DPum8="
      />

      <button type="submit">Pay with eSewa Sandbox</button>
    </form>
  </body>
</html>
